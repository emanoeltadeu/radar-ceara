name: Radar Ceará · Atualização Automática de Dados com IA

on:
  # Agendamento estratégico de 4 rodadas diárias no fuso de Fortaleza/CE (UTC-3):
  # 07:30 CE -> 10:30 UTC
  # 12:30 CE -> 15:30 UTC
  # 17:30 CE -> 20:30 UTC
  # 21:30 CE -> 00:30 UTC (D+1)
  # Agendamento desativado temporariamente para controle manual de custos da cota
  # schedule:
  #   - cron: '30 10 * * *'  # 07:30 Fortaleza/CE
  #   - cron: '30 15 * * *'  # 12:30 Fortaleza/CE
  #   - cron: '30 20 * * *'  # 17:30 Fortaleza/CE
  #   - cron: '30 0 * * *'   # 21:30 Fortaleza/CE

  # Permite disparar manualmente pelo botão "Run workflow" no GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Executar Pipeline de Inteligência (YouTube, Instagram, Trends e Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          python scripts/gerar_radar_ce.py

      - name: Salvar Dados Atualizados no Repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/radar_ce.json dados/cache_*.json dados/estado_rodizio_ig.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(radar): atualização automática de redes e IA" && git push origin main)
