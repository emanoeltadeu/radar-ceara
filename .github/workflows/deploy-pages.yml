name: Radar Ceará · Atualização Automática de Dados com IA

on:
  # Agendamento único às 23h do Ceará (02:00 UTC):
  schedule:
    - cron: '0 2 * * *'

  # Permite disparar manualmente pelo botão "Run workflow" no GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Executar Pipeline de Inteligência (YouTube, Instagram, Trends e Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          python scripts/gerar_radar_ce.py

      - name: Salvar Dados Atualizados no Repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/radar_ce.json dados/cache_*.json dados/estado_rodizio_ig.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(radar): atualização automática de redes e IA" && git push origin main)
